<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comments in HTML</title>
</head>
<body>
    <!-- Komentar tidak akan dieksekusi di halaman -->
    <!-- komentar bisa berfungsi untuk menunjukan atau menandai fungsi -->

    <!-- contoh -->
    <!-- Teks dibawah menampilkan Heading -->
    <h1>Text Heading</h1><br>

    <!-- Teks dibawah menampilkan paragraf -->
    <p>Text Paragraph</p>
</body>
</html>
