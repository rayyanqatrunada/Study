<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>List in HTML</title>
</head>
<body>
    <!-- List dengan tanda ● -->
    <ul>
        <li>Name 1</li>
        <li>Name 2</li>
        <li>Name 3</li>
        <li>Name 4</li>
    </ul>

    <br>
    <!-- list dengan angka -->
    <ol>
        <li>Name 1</li>
        <li>Name 2</li>
        <li>Name 3</li>
        <li>Name 4</li>
    </ol>

    <br>
    <!-- List with deskripsi -->
    <dl>
        <dt>Name 1</dt>
        <dd>* This is first name</dd>
        <dt>Name 2</dt>
        <dd>* This is second name</dd>
    </dl>
</body>
</html>
