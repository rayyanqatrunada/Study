<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Format in HTML</title>
</head>
<body>
    <pre>
    <!-- bold text -->
     <b>This is bold text</b>
     <strong>This is strong text</strong>

    <!-- Italic text -->
     <em>Empashized</em>
     <i>Italic</i>

    <!-- Mark text -->
     Mark this <mark>This is important information</mark> <!-- mark pada teks -->

    <!-- Line in text -->
     Dont do this <del>do it</del> <!-- memberi garis di tengah teks -->
     <ins>inserted</ins>

    <!-- Size and position -->
     <small>This is quite small</small>
     O<sub>2</sub> <!-- sub akan membuat text/number kecil di bawah -->
     7<sup>3</sup> <!-- sup akan membuat text/number kecil di atas -->
    </pre>
</body>
</html>
