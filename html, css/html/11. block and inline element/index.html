<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Block and Inline element</title>
</head>
<body>
    <!-- div bisa disebut sebagai wadah -->
    <!-- Saat mengubah style di div semua isinya akan mengikuti -->

    <!-- contoh -->
    <div style="color: white; background-color: black;">
        <h1>This is firt div</h1>
        <p>The bold text is <b>inline</b></p>
    </div>

    <div style="color: red; background-color: moccasin;">
        <h1>Another div</h1>
        <p>The italic text is <i>inline</i></p>
    </div>
</body>
</html>
