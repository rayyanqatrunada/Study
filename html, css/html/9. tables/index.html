<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tables in HTML</title>
</head>
<body>
    <table>
        <tr>
            <th>Name</th>
            <th>Age</th>
            <th>Class</th>
        </tr>

        <tr>
            <td>Yui</td>
            <td>17</td>
            <td>XI</td>
        </tr>

        <tr>
            <td>Clara</td>
            <td>12</td>
            <td>VI</td>
        </tr>
    </table>
</body>
</html>
